<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#00A5EB">
    <title>Skuling: Badges</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,1,0"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/globals.css">
    <link rel="stylesheet" href="./css/guide.css">
    <link rel="stylesheet" href="./css/badges.css">
</head>

<body data-page="badges">
    <div class="device-frame">
        <main class="bdg">

            <header class="bdg-top-bar">
                <button class="back-btn btn-reset" type="button" aria-label="Kembali" onclick="history.back()">
                    <span class="material-symbols-outlined icon-sm" aria-hidden="true">arrow_back</span>
                </button>
                <h1 class="bdg-title">Badges (@adyyt)</h1>
            </header>

            <div class="bdg-filter-wrap">
                <button class="bdg-filter-bar btn-reset" type="button" id="bdgFilterBtn" aria-haspopup="listbox"
                    aria-expanded="false">
                    <span id="bdgFilterLabel">Semua (10/20)</span>
                    <span class="material-symbols-outlined icon-sm" aria-hidden="true">expand_more</span>
                </button>
                <div class="bdg-filter-dropdown" id="bdgFilterDropdown" role="listbox" hidden>
                    <button type="button" class="bdg-filter-row is-active" data-category="semua">Semua
                        (10/20)</button>
                    <button type="button" class="bdg-filter-row" data-category="battle"
                        data-not-in-scenario>Battle (3/5)</button>
                    <button type="button" class="bdg-filter-row" data-category="freestyle"
                        data-not-in-scenario>Freestyle (1/3)</button>
                    <button type="button" class="bdg-filter-row" data-category="general"
                        data-not-in-scenario>General (2/3)</button>
                    <button type="button" class="bdg-filter-row" data-category="social"
                        data-not-in-scenario>Social (1/3)</button>
                    <button type="button" class="bdg-filter-row" data-category="streak"
                        data-not-in-scenario>Streak (2/3)</button>
                    <button type="button" class="bdg-filter-row" data-category="tryout">Tryout (1/3)</button>
                </div>
            </div>

            <section class="bdg-category" data-category="battle">
                <div class="bdg-category-head">
                    <span>Battle</span>
                    <span>3/5</span>
                </div>
                <div class="bdg-grid">
                    <button type="button" class="bdg-card" data-not-in-scenario>
                        <img src="./img/badge-battle-duel-master.png" alt="">
                        <span>Duel Master</span>
                    </button>
                    <button type="button" class="bdg-card" data-not-in-scenario>
                        <img src="./img/badge-battle-undefeated-champion.png" alt="">
                        <span>Undefeated Champion</span>
                    </button>
                    <button type="button" class="bdg-card" data-not-in-scenario>
                        <img src="./img/badge-battle-comeback-kid.png" alt="">
                        <span>Comeback Kid</span>
                    </button>
                    <button type="button" class="bdg-card bdg-card--locked" data-not-in-scenario>
                        <img src="./img/badge-battle-veteran.png" alt="">
                        <span>Battle Veteran</span>
                    </button>
                    <button type="button" class="bdg-card bdg-card--locked" data-not-in-scenario>
                        <img src="./img/badge-battle-giant-slayer.png" alt="">
                        <span>Giant Slayer</span>
                    </button>
                </div>
            </section>

            <section class="bdg-category" data-category="freestyle">
                <div class="bdg-category-head">
                    <span>Freestyle</span>
                    <span>1/3</span>
                </div>
                <div class="bdg-grid">
                    <button type="button" class="bdg-card" data-not-in-scenario>
                        <img src="./img/badge-freestyle-prodigy.png" alt="">
                        <span>Freestyle Prodigy</span>
                    </button>
                    <button type="button" class="bdg-card bdg-card--locked" data-not-in-scenario>
                        <img src="./img/badge-freestyle-all-rounder.png" alt="">
                        <span>Freestyle All Rounder</span>
                    </button>
                    <button type="button" class="bdg-card bdg-card--locked" data-not-in-scenario>
                        <img src="./img/badge-freestyle-precision-speedster.png" alt="">
                        <span>Precision Speedster</span>
                    </button>
                </div>
            </section>

            <section class="bdg-category" data-category="general">
                <div class="bdg-category-head">
                    <span>General</span>
                    <span>2/3</span>
                </div>
                <div class="bdg-grid">
                    <button type="button" class="bdg-card" data-not-in-scenario>
                        <img src="./img/badge-general-top100.png" alt="">
                        <span>Top 100 SkulChamps</span>
                    </button>
                    <button type="button" class="bdg-card" data-not-in-scenario>
                        <img src="./img/badge-general-top1000.png" alt="">
                        <span>Top 1000 SkulChamps</span>
                    </button>
                    <button type="button" class="bdg-card bdg-card--locked" data-not-in-scenario>
                        <img src="./img/badge-general-skulingpro-member.png" alt="">
                        <span>Skuling Pro Member 1 Bulan</span>
                    </button>
                </div>
            </section>

            <section class="bdg-category" data-category="social">
                <div class="bdg-category-head">
                    <span>Social</span>
                    <span>1/3</span>
                </div>
                <div class="bdg-grid">
                    <button type="button" class="bdg-card" data-not-in-scenario>
                        <img src="./img/badge-social-avatar-artiste.png" alt="">
                        <span>Avatar Artiste</span>
                    </button>
                    <button type="button" class="bdg-card bdg-card--locked" data-not-in-scenario>
                        <img src="./img/badge-social-skuling-friendly.png" alt="">
                        <span>Skuling Friendly</span>
                    </button>
                    <button type="button" class="bdg-card bdg-card--locked" data-not-in-scenario>
                        <img src="./img/badge-social-skuling-ambissador.png" alt="">
                        <span>Skuling Ambissador</span>
                    </button>
                </div>
            </section>

            <section class="bdg-category" data-category="streak">
                <div class="bdg-category-head">
                    <span>Streak</span>
                    <span>2/3</span>
                </div>
                <div class="bdg-grid">
                    <button type="button" class="bdg-card" data-not-in-scenario>
                        <img src="./img/badge-streak-7day.png" alt="">
                        <span>7 Day Streak</span>
                    </button>
                    <button type="button" class="bdg-card" data-not-in-scenario>
                        <img src="./img/badge-streak-battle-warrior.png" alt="">
                        <span>Battle Streak Warrior</span>
                    </button>
                    <button type="button" class="bdg-card bdg-card--locked" data-not-in-scenario>
                        <img src="./img/badge-streak-night-owl.png" alt="">
                        <span>Night Owl</span>
                    </button>
                </div>
            </section>

            <section class="bdg-category" data-category="tryout">
                <div class="bdg-category-head">
                    <span>Tryout</span>
                    <span>1/3</span>
                </div>
                <div class="bdg-grid">
                    <button type="button" class="bdg-card" id="tryoutImprovementStarBtn">
                        <img src="./img/badge-tryout-improvement-star.png" alt="">
                        <span>Tryout Improvement Star</span>
                    </button>
                    <button type="button" class="bdg-card bdg-card--locked" data-not-in-scenario>
                        <img src="./img/badge-tryout-consistency-champ.png" alt="">
                        <span>Tryout Consistency Champ</span>
                    </button>
                    <button type="button" class="bdg-card bdg-card--locked" data-not-in-scenario>
                        <img src="./img/badge-utbk-stamina-star.png" alt="">
                        <span>UTBK Stamina Star</span>
                    </button>
                </div>
            </section>

            <div class="pemanasan-overlay" id="tryout-overlay" role="dialog" aria-modal="true"
                aria-labelledby="tryout-badge-title">
                <div class="pemanasan-card">
                    <div class="pemanasan-header">
                        <span id="tryout-badge-title" class="pemanasan-title">Badge</span>
                        <button class="pemanasan-close btn-reset" type="button" id="tryout-close-x"
                            aria-label="Tutup">
                            <span class="material-symbols-outlined">close</span>
                        </button>
                    </div>
                    <div class="pemanasan-body bdg-overlay-body">
                        <h2 class="bdg-overlay-name">Tryout Improvement Star</h2>
                        <div class="bdg-overlay-art">
                            <img src="./img/badge-tryout-improvement-star.png" alt="">
                        </div>
                        <span class="bdg-overlay-rarity">Hanya dimiliki 1% SkulChamps</span>
                        <p class="pemanasan-text">Meningkatkan skor Tryout sebesar 50% dari Tryout terendah</p>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script src="./scripts/scripts.js"></script>
    <script src="./scripts/badges.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js").catch(() => {});
            });
        }
    </script>
</body>

</html>
