<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#00A5EB">
    <title>Skuling: Bahasa Indonesia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,1,0"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/globals.css">
    <link rel="stylesheet" href="./css/guide.css">
    <link rel="stylesheet" href="./css/bahasa-indonesia.css">
</head>

<body data-page="bahasa-indonesia">
    <div class="device-frame">
        <main class="bahasa-indonesia">

            <header class="app-top-bar app-top-bar--simple">
                <button class="back-btn btn-reset" type="button" aria-label="Kembali">
                    <span class="material-symbols-outlined icon-sm" aria-hidden="true">arrow_back</span>
                </button>
                <h1 class="page-title">Bahasa Indonesia</h1>
            </header>

            <div class="filter-row" role="group" aria-label="Filter modul">
                <button class="filter-pill btn-reset" type="button" aria-haspopup="listbox" aria-expanded="false"
                    data-not-in-scenario>
                    <span class="filter-pill-label"><strong>Kelas</strong> Semua</span>
                    <span class="material-symbols-outlined icon-sm" aria-hidden="true">expand_more</span>
                </button>
                <button class="filter-pill btn-reset" type="button" aria-haspopup="listbox" aria-expanded="false"
                    data-not-in-scenario>
                    <span class="filter-pill-label"><strong>Status</strong> Semua</span>
                    <span class="material-symbols-outlined icon-sm" aria-hidden="true">expand_more</span>
                </button>
            </div>

            <section class="module-list" id="moduleList" aria-label="Daftar modul Bahasa Indonesia">
            </section>

        </main>
    </div>

    <script src="./scripts/scripts.js"></script>
    <script src="./scripts/bahasa-indonesia.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js").catch(() => {});
            });
        }
    </script>
</body>

</html>
