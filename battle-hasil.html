<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#00A5EB">
    <meta name="theme-color" content="#176f5c">
    <title>Skuling: Hasil Battle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,1,0"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/globals.css">
    <link rel="stylesheet" href="./css/guide.css">
    <link rel="stylesheet" href="./css/battle-match.css">
</head>

<body data-page="battle-hasil">
    <div class="device-frame">
        <main class="battle-match">

            <section class="bm-result" id="screenResult">
                <header class="bm-top-bar bm-top-bar--result">
                    <span class="bm-top-bar-title">Hasil Battle Star</span>
                </header>

                <h1 class="bm-result-title" id="resultTitle">You WIN!</h1>

                <div class="bm-result-card" id="resultUserCard">
                    <div class="bm-result-card-head">
                        <span id="resultUserName">Responden</span>
                        <span id="resultUserTime">00:00</span>
                    </div>
                    <div class="bm-result-card-body">
                        <span class="bm-result-avatar bm-result-avatar--user" id="resultUserAvatar">R</span>
                        <div class="bm-result-stat-grid">
                            <span class="bm-result-stat"><strong
                                    id="resultUserCorrect">0</strong><small>Benar</small></span>
                            <span class="bm-result-stat"><strong
                                    id="resultUserWrong">0</strong><small>Salah</small></span>
                            <span class="bm-result-stat"><strong
                                    id="resultUserSkipped">0</strong><small>Dilewati</small></span>
                            <span class="bm-result-stat"><strong id="resultUserRating">1500
                                    (+0)</strong><small>Rating</small></span>
                        </div>
                    </div>
                </div>

                <div class="bm-result-card" id="resultOpponentCard">
                    <div class="bm-result-card-head">
                        <span>Kak Aji</span>
                        <span id="resultOpponentTime">00:00</span>
                    </div>
                    <div class="bm-result-card-body">
                        <img class="bm-result-avatar" src="https://dyn-assets.skuling.id/skuling-storage/uploaded/file/3c0bb941-4c36-4a2d-b73c-6e4a217fc902-1754636847004" alt="">
                        <div class="bm-result-stat-grid">
                            <span class="bm-result-stat"><strong
                                    id="resultOpponentCorrect">0</strong><small>Benar</small></span>
                            <span class="bm-result-stat"><strong
                                    id="resultOpponentWrong">0</strong><small>Salah</small></span>
                            <span class="bm-result-stat"><strong
                                    id="resultOpponentSkipped">0</strong><small>Dilewati</small></span>
                            <span class="bm-result-stat"><strong id="resultOpponentRating">2142
                                    (+0)</strong><small>Rating</small></span>
                        </div>
                    </div>
                </div>

                <button class="bm-result-cta btn-reset" type="button" id="btnBattleAgain">Battle Ulang</button>
                <div class="bm-result-secondary">
                    <a class="bm-result-ghost" href="pembahasan.html">Lihat Pembahasan</a>
                    <a class="bm-result-ghost" href="insight.html">Kembali ke Beranda</a>
                </div>
            </section>

        </main>
    </div>

    <script src="./scripts/scripts.js"></script>
    <script src="./scripts/battle-hasil.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js").catch(() => {});
            });
        }
    </script>
</body>

</html>
