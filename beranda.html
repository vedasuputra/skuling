<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#00A5EB">
    <title>Skuling: Beranda</title>
    <link rel="stylesheet" href="./css/globals.css">
    <link rel="stylesheet" href="./css/guide.css">
    <link rel="stylesheet" href="./css/beranda.css">
    <link rel="stylesheet" href="./css/battle.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,1,0"
        rel="stylesheet">
</head>

<body data-home-tab="xplain">
    <div class="device-frame">
        <div id="topbarPlaceholder"></div>

        <div id="homeNavbarPlaceholder"></div>

        <div class="home-swipe" id="homeSwipeViewport">
            <div class="home-swipe-track" id="homeSwipeTrack">

                <main class="xplain" data-home-panel="xplain">

                    <div id="streakPlaceholderXplain"></div>

                    <section class="category-row" aria-label="Kategori materi">
                        <button class="category-btn" type="button" id="mandiriBtn" aria-label="Pilih materi Mandiri">
                            <span class="text-wrapper-2">Mandiri</span>
                            <span class="image-wrap">
                                <img class="category-icon" src="./img/xplainMandiri.png" alt="">
                            </span>
                        </button>
                        <button class="category-btn" type="button" id="tkaBtn" aria-label="Pilih materi Sekolah/TKA">
                            <span class="text-wrapper-2">Sekolah/TKA</span>
                            <span class="image-wrap">
                                <img class="category-icon" src="./img/xplainTKA.png" alt="">
                            </span>
                        </button>
                        <button class="category-btn" type="button" id="snbtBtn" aria-label="Pilih materi SNBT">
                            <span class="text-wrapper-2">SNBT</span>
                            <span class="image-wrap">
                                <img class="category-icon" src="./img/xplainSNBT.png" alt="">
                            </span>
                        </button>
                        <button class="category-btn" type="button" id="kedinasanBtn"
                            aria-label="Pilih materi Kedinasan">
                            <span class="text-wrapper-2">Kedinasan</span>
                            <span class="image-wrap">
                                <img class="category-icon" src="./img/xplainKedinasan.png" alt="">
                            </span>
                        </button>
                    </section>

                    <section aria-labelledby="materi-rekomendasi" class="materi-section">
                        <h1 id="materi-rekomendasi" class="text-wrapper">Materi Rekomendasi</h1>
                        <div class="materi-list" id="materiList"></div>
                    </section>

                </main>

                <main class="battle" data-home-panel="battle">

                    <div id="streakPlaceholderBattle"></div>

                    <section class="battle-chips-row" aria-label="Filter dan status battle">
                        <h1 class="battle-section-title">Jenis Battle</h1>
                        <div class="battle-chips">
                            <button type="button" class="battle-chip battle-chip--pro" data-not-in-scenario>
                                <span class="battle-chip-badge">
                                    <span class="material-symbols-outlined icon-xxs" aria-hidden="true">close</span>
                                    PRO
                                </span>
                                <span class="battle-chip-label">Blacklist Subtes</span>
                            </button>
                            <button type="button" class="battle-chip battle-chip--energy" data-not-in-scenario>
                                <span class="battle-chip-badge battle-chip-badge--energy">
                                    <img src="./img/battle-energy-icon.png" alt="">
                                    3
                                </span>
                                <span class="battle-chip-label">SmartEnergy</span>
                            </button>
                        </div>
                    </section>

                    <section class="battle-modes" aria-label="Pilihan mode battle">
                        <button type="button" class="battle-card battle-card--random" data-not-in-scenario
                            aria-label="Random Battle, tantang pemain yang sedang online secara acak">
                            <img class="battle-card-photo" src="./img/random-battle.png" alt="Random Battle">
                        </button>

                        <div class="battle-card-row">
                            <button type="button" class="battle-card battle-card--friend" data-not-in-scenario
                                aria-label="Challenge Teman, buktikan siapa yang lebih jago, kamu atau temanmu">
                                <img class="battle-card-photo" src="./img/challenge-teman.png" alt="Challenge Teman">
                            </button>

                            <button type="button" class="battle-card battle-card--stars" id="battleStarsBtn"
                                aria-label="Battle with the Stars, lawan AI tokoh Skuling kapan pun kamu mau">
                                <img class="battle-card-photo" src="./img/battle-with-the-stars.png"
                                    alt="Battle with the Stars">
                            </button>
                        </div>
                    </section>

                </main>

            </div>
        </div>

        <div id="navbarPlaceholder"></div>
    </div>

    <script src="./scripts/scripts.js"></script>
    <script src="./scripts/home-swipe.js"></script>
    <script src="./scripts/beranda.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js").catch(() => {});
            });
        }
    </script>
</body>

</html>
