<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Skuling: Buat Chat Baru</title>
    <link rel="stylesheet" href="./css/globals.css">
    <link rel="stylesheet" href="./css/guide.css">
    <link rel="stylesheet" href="./css/chat.css">
    <link rel="stylesheet" href="./css/buat-chat-baru.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,1,0"
        rel="stylesheet">
</head>

<body data-page="chat">
    <div class="device-frame">
        <main class="buat-chat-baru">

            <header class="app-top-bar app-top-bar--simple">
                <div class="app-top-bar-row">
                    <div class="app-top-bar-left">
                        <button class="back-btn btn-reset" type="button" aria-label="Kembali" id="bcbBackBtn">
                            <span class="material-symbols-outlined icon-sm" aria-hidden="true">arrow_back</span>
                        </button>
                        <h1 class="page-title">Buat Chat Baru</h1>
                    </div>
                    <button class="school-filter-btn btn-reset" type="button" data-not-in-scenario>
                        <span class="material-symbols-outlined icon-xs" aria-hidden="true">account_balance</span>
                        <span>Teman Satu Sekolah</span>
                    </button>
                </div>
            </header>

            <div class="search-bar">
                <input class="search-input" type="text" id="friendSearchInput" placeholder="Ketik nama atau username..."
                    autocomplete="off" aria-label="Cari nama atau username">
                <span class="material-symbols-outlined icon-sm search-icon" aria-hidden="true">search</span>
            </div>

            <div class="friend-list" id="friendList" aria-label="Daftar teman"></div>

        </main>
    </div>

    <script src="./scripts/scripts.js"></script>
    <script src="./scripts/buat-chat-baru.js"></script>
</body>

</html>
