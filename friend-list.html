<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Skuling: Daftar Teman</title>
    <link rel="stylesheet" href="./css/globals.css">
    <link rel="stylesheet" href="./css/guide.css">
    <link rel="stylesheet" href="./css/friend-list.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,1,0"
        rel="stylesheet">
</head>

<body data-page="profile">
    <div class="device-frame">
        <main class="friend-list-page">

            <header class="app-top-bar app-top-bar--simple">
                <div class="app-top-bar-row">
                    <div class="app-top-bar-left">
                        <button class="back-btn btn-reset" type="button" aria-label="Kembali" id="flBackBtn">
                            <span class="material-symbols-outlined icon-sm" aria-hidden="true">arrow_back</span>
                        </button>
                        <h1 class="page-title">Daftar Teman</h1>
                    </div>
                    <button class="tambah-teman-btn btn-reset" type="button" id="tambahTemanTopBtn"
                        aria-label="Tambah teman">
                        <span class="material-symbols-outlined icon-xs" aria-hidden="true">person_add</span>
                        <span>Tambah Teman</span>
                    </button>
                </div>
            </header>

            <div class="friend-list-tabs" role="tablist" aria-label="Tab teman">
                <button type="button" class="friend-list-tab friend-list-tab--active" role="tab"
                    aria-selected="true">Teman</button>
                <button type="button" class="friend-list-tab" role="tab" aria-selected="false"
                    data-not-in-scenario>Permintaan</button>
            </div>

            <section class="friend-list-empty" aria-labelledby="friend-list-empty-title">
                <img class="friend-list-illustration" src="./img/friends-empty.png" alt="Ilustrasi belum ada teman">
                <p id="friend-list-empty-title" class="friend-list-empty-text">
                    Belum ada teman yang ditambahkan.<br>
                    Klik <strong>Tambah Teman</strong> untuk mencari teman baru!
                </p>
                <button class="tambah-teman-btn tambah-teman-btn--large btn-reset" type="button"
                    id="tambahTemanBodyBtn" aria-label="Tambah teman">
                    <span class="material-symbols-outlined icon-sm" aria-hidden="true">person_add</span>
                    <span>Tambah Teman</span>
                </button>
            </section>

        </main>
    </div>

    <script src="./scripts/scripts.js"></script>
    <script src="./scripts/friend-list.js"></script>
</body>

</html>
