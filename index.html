<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <script>
        if (localStorage.getItem("skuling_registered") === "1") {
            location.replace("beranda.html");
        }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#00A5EB">
    <title>Skuling</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,1,0"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/globals.css">
    <link rel="stylesheet" href="./css/guide.css">
    <link rel="stylesheet" href="./css/index.css">
</head>

<body>
    <div class="device-frame">
        <div class="welcome">
            <header class="top-bar">
                <img class="logo-img" src="img/logo.png" alt="Skuling">
            </header>

            <main class="content-area">
                <section class="welcome-heading-group" aria-labelledby="welcome-heading">
                    <h1 id="welcome-heading" class="siap-wujudkan-kampus">
                        Siap Wujudkan<br>Kampus Impianmu?
                    </h1>
                    <p class="text-wrapper">
                        400.000+ siswa sudah mulai perjalanan mereka. Sekarang giliran kamu.
                    </p>
                </section>
                <div class="account-actions" aria-label="Pilihan akun">
                    <a href="kenalan.html">
                        <button class="streak" type="button" aria-label="Daftar sekarang">
                            <span class="text-wrapper-2">Daftar Sekarang</span>
                        </button>
                    </a>
                    <p class="sudah-punya-akun">
                        <span class="span">Sudah punya akun? </span>
                        <button class="text-wrapper-3" id="masukBtn" type="button"
                            aria-label="Masuk ke akun">Masuk</button>
                    </p>
                </div>
            </main>

            <div class="bottom-area">
                <img class="mascot" src="img/mascotWelcome.png" alt="" aria-hidden="true">
            </div>
        </div>
    </div>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js").catch(() => {});
            });
        }
    </script>
</body>

<script src="./scripts/scripts.js"></script>
<script>
    document.getElementById("masukBtn").addEventListener("click", () => {
        showToast("Bukan bagian dari skenario tugas, coba lagi.");
    });
</script>

</html>
