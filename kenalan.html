<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#00A5EB">
    <title>Skuling: Daftar</title>
    <link rel="stylesheet" href="./css/globals.css">
    <link rel="stylesheet" href="./css/guide.css">
    <link rel="stylesheet" href="./css/kenalan.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,1,0"
        rel="stylesheet">
</head>

<body>
    <div class="device-frame">
        <main class="kenalan">
            <h1 class="text-wrapper">Yuk, kenalan dulu!</h1>
            <form class="kenalan-form" action="#" method="post">
                <div class="field-group">
                    <div class="field-label-row">
                        <label class="text-wrapper-2" for="full-name">Nama Lengkap</label>
                        <span class="field-error" id="full-name-error"></span>
                    </div>
                    <div class="streak">
                        <input id="full-name" class="text-wrapper-3" name="fullName" type="text"
                            placeholder="Eg. Skully Skully" autocomplete="name" required>
                    </div>
                </div>
                <div class="field-group">
                    <div class="field-label-row">
                        <label class="text-wrapper-2" for="username">Username</label>
                        <span class="field-error" id="username-error"></span>
                    </div>
                    <div class="streak">
                        <input id="username" class="text-wrapper-3" name="username" type="text"
                            placeholder="Eg. skulchamp" autocomplete="username" autocapitalize="none" spellcheck="false"
                            required>
                    </div>
                </div>
                <div class="field-group">
                    <div class="field-label-row">
                        <label class="text-wrapper-2" for="phone">No. Telpon</label>
                        <span class="field-error" id="phone-error"></span>
                    </div>
                    <div class="streak">
                        <input id="phone" class="text-wrapper-3" name="phone" type="tel" placeholder="Eg. 081234567001"
                            autocomplete="tel" inputmode="tel" required>
                    </div>
                </div>
                <div class="field-group">
                    <div class="field-label-row">
                        <label class="text-wrapper-2" for="email">Email</label>
                        <span class="field-error" id="email-error"></span>
                    </div>
                    <div class="streak">
                        <input id="email" class="text-wrapper-3" name="email" type="email"
                            placeholder="Eg. skuling@gmail.com" autocomplete="email" autocapitalize="none"
                            spellcheck="false" required>
                    </div>
                </div>
                <div class="field-group">
                    <div class="field-label-row">
                        <label class="text-wrapper-2" for="password">Password</label>
                        <span class="field-error" id="password-error"></span>
                    </div>
                    <div class="streak">
                        <input id="password" class="text-wrapper-3" name="password" type="password"
                            placeholder="Minimal 8 karakter" autocomplete="new-password" minlength="8" required>
                        <button class="eye-closed" type="button" aria-label="Tampilkan password"
                            aria-controls="password" aria-pressed="false">
                            <span class="material-symbols-outlined" aria-hidden="true">visibility_off</span>
                        </button>
                    </div>
                </div>
                <div class="field-group" role="group" aria-label="Lokasi">
                    <div class="field-label-row">
                        <label class="text-wrapper-2" id="province-label">Provinsi</label>
                        <span class="field-error" id="province-error"></span>
                    </div>
                    <button type="button" class="streak province-trigger" id="provinceTrigger" aria-haspopup="listbox"
                        aria-expanded="false" aria-labelledby="province-label province-value">
                        <span class="text-wrapper-3" id="province-value" data-placeholder="true">Pilih provinsi</span>
                        <span class="material-symbols-outlined chevron-icon" aria-hidden="true">expand_more</span>
                    </button>
                    <input type="hidden" id="province" name="province" required>
                </div>
                <div class="education-fields" role="group" aria-label="Pendidikan">
                    <div class="education-field">
                        <label class="text-wrapper-2" for="school">Asal Sekolah</label>
                        <div class="streak">
                            <input id="school" class="text-wrapper-3" name="school" type="text"
                                placeholder="Eg. SMA LAB UNDIKSHA" autocomplete="organization" required>
                        </div>
                    </div>
                    <div class="education-field">
                        <label class="text-wrapper-2" id="grade-label">Kelas</label>
                        <div class="dropdown-wrapper">
                            <button type="button" class="streak grade-trigger" id="gradeTrigger" aria-haspopup="listbox"
                                aria-expanded="false" aria-labelledby="grade-label grade-value">
                                <span class="text-wrapper-3" id="grade-value" data-placeholder="true">Pilih kelas</span>
                                <span class="material-symbols-outlined chevron-icon"
                                    aria-hidden="true">expand_more</span>
                            </button>
                            <input type="hidden" id="grade" name="grade" required>
                            <ul class="dropdown-list" id="gradeList" role="listbox" aria-label="Daftar kelas" hidden>
                                <li><button type="button" role="option" data-value="Kelas 10">Kelas 10</button></li>
                                <li><button type="button" role="option" data-value="Kelas 11">Kelas 11</button></li>
                                <li><button type="button" role="option" data-value="Kelas 12">Kelas 12</button></li>
                                <li><button type="button" role="option" data-value="Gap Year">Gap Year</button></li>
                            </ul>
                        </div>
                    </div>
                </div>
                <fieldset class="field-group">
                    <legend class="text-wrapper-2">Tahu Skuling dari mana?</legend>
                    <div class="referral-options">
                        <label class="referral-option">
                            <input type="radio" name="referralSource" value="X/Twitter">
                            <span class="text-wrapper-4">X/Twitter</span>
                        </label>
                        <label class="referral-option">
                            <input type="radio" name="referralSource" value="Instagram">
                            <span class="text-wrapper-4">Instagram</span>
                        </label>
                        <label class="referral-option">
                            <input type="radio" name="referralSource" value="Teman">
                            <span class="text-wrapper-4">Teman</span>
                        </label>
                        <label class="referral-option">
                            <input type="radio" name="referralSource" value="Lainnya">
                            <span class="text-wrapper-4">Lainnya</span>
                        </label>
                    </div>
                </fieldset>
                <footer class="navbar">
                    <div class="auth-row" id="authRow">
                        <button class="streak-2" id="googleBtn" type="button">
                            <span class="google">
                                <img class="google-icon" src="img/google.svg" alt="">
                            </span>
                            <span class="text-wrapper-5">Google</span>
                        </button>
                        <button class="streak-3" id="submitBtn" type="submit" disabled>
                            <span class="text-wrapper-6">Daftar E-mail</span>
                        </button>
                    </div>
                </footer>
                <div class="sheet-overlay" id="sheetOverlay" hidden>
                    <div class="sheet" id="provinceSheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
                        <div class="sheet-header">
                            <h2 class="sheet-title" id="sheet-title">Pilih Provinsi</h2>
                            <button type="button" class="sheet-close" id="sheetClose" aria-label="Tutup">
                                <span class="material-symbols-outlined" aria-hidden="true">close</span>
                            </button>
                        </div>
                        <div class="sheet-search">
                            <span class="material-symbols-outlined search-icon" aria-hidden="true">search</span>
                            <input type="text" id="provinceSearch" placeholder="Cari provinsi..." autocomplete="off"
                                autocapitalize="none" spellcheck="false" aria-label="Cari provinsi">
                        </div>
                        <ul class="sheet-list" id="provinceList" role="listbox" aria-label="Daftar provinsi"></ul>
                    </div>
                </div>
            </form>
        </main>
    </div>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js").catch(() => {});
            });
        }
    </script>
</body>
<script src="./scripts/scripts.js"></script>
<script src="./scripts/kenalan.js"></script>
<script>
    document.getElementById("googleBtn").addEventListener("click", () => {
        showToast("Bukan bagian dari skenario tugas, coba lagi.");
    });

    form.addEventListener("submit", (e) => {
    e.preventDefault(); 

    checkFormValidity();

    if (submitBtn.disabled) {
        showToast("Mohon lengkapi semua data dengan benar.");
        return;
    }

    window.location.href = "tujuan.html";
});
</script>

</html>
