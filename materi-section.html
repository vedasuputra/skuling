<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Skuling: Materi</title>
    <link rel="stylesheet" href="./css/globals.css">
    <link rel="stylesheet" href="./css/guide.css">
    <link rel="stylesheet" href="./css/materi-section.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,1,0"
        rel="stylesheet">
</head>

<body data-page="materi-section">
    <div class="device-frame">
        <main class="materi-section">

            <header class="app-top-bar app-top-bar--simple materi-top-bar">
                <button class="back-btn btn-reset" type="button" aria-label="Kembali">
                    <span class="material-symbols-outlined icon-sm" aria-hidden="true">arrow_back</span>
                </button>
                <div class="materi-title-block">
                    <h1 class="materi-title">Mengenal Bahasa Indonesia di TKA</h1>
                    <p class="materi-subtitle">Bahasa Indonesia</p>
                </div>
                <div class="materi-actions">
                    <button class="tanya-skully-btn btn-reset" type="button" data-not-in-scenario>
                        <span class="tanya-skully-icon">
                            <img src="./img/mascot-skully-icon.png" alt="">
                        </span>
                        <span class="tanya-skully-text">Tanya Skully</span>
                    </button>
                </div>
            </header>

            <div class="progress-strip" role="progressbar" aria-label="Progres materi" aria-valuenow="0"
                aria-valuemin="0" aria-valuemax="100">
                <span class="progress-strip-fill" id="progressFill" style="width: 0%"></span>
            </div>

            <div class="filter-wrap">
                <button class="filter-bar btn-reset" type="button" id="filterBarBtn" aria-haspopup="listbox"
                    aria-expanded="false">
                    <span class="filter-bar-label" id="filterBarLabel"></span>
                    <span class="material-symbols-outlined icon-sm" aria-hidden="true">expand_more</span>
                </button>
                <div class="filter-dropdown" id="filterDropdown" role="listbox" hidden></div>
            </div>

            <section class="materi-content" id="materiContent" aria-label="Isi materi"></section>

            <nav class="materi-navbar" aria-label="Aksi materi">
                <div class="materi-navbar-row">
                    <button class="materi-cta materi-cta--back btn-reset" type="button" id="backSectionBtn"></button>
                    <button class="materi-cta materi-cta--next btn-reset" type="button" id="nextSectionBtn"></button>
                </div>
            </nav>

        </main>
    </div>

    <script src="./scripts/scripts.js"></script>
    <script src="./scripts/materi-data.js"></script>
    <script src="./scripts/materi-section.js"></script>
</body>

</html>
