<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#00A5EB">
    <title>Skuling: Daily Missions</title>
    <link rel="stylesheet" href="./css/globals.css">
    <link rel="stylesheet" href="./css/guide.css">
    <link rel="stylesheet" href="./css/misi.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,1,0"
        rel="stylesheet">
</head>

<body data-page="misi">
    <div class="device-frame">
        <main class="misi">

            <header class="misi-top-bar">
                <button class="back-btn btn-reset" type="button" aria-label="Kembali">
                    <span class="material-symbols-outlined icon-sm" aria-hidden="true">arrow_back</span>
                </button>
                <img class="misi-logo" src="./img/logo-skuling-white.png" alt="Skuling">
                <span class="misi-rating-pill">
                    <span class="material-symbols-outlined icon-sm" aria-hidden="true">rocket_launch</span>
                    <span id="ratingCount">0</span>
                </span>
            </header>

            <section class="misi-banner">
                <div class="booster-grid" id="boosterGrid"></div>
            </section>

            <div class="misi-section-row">
                <span class="misi-section-title">Daily Missions</span>
                <span class="misi-countdown">
                    <span class="material-symbols-outlined icon-xs" aria-hidden="true">schedule</span>
                    <span id="countdownTimer">00:00:00</span>
                </span>
            </div>

            <section class="misi-list" id="misiList" aria-label="Daftar misi harian"></section>

            <div class="misi-overlay" id="spinOverlay" hidden>
                <div class="misi-modal">
                    <header class="misi-modal-header">
                        <h2 class="misi-modal-title">Claim Power Up</h2>
                        <button class="misi-modal-close btn-reset" type="button" id="spinCloseBtn" aria-label="Tutup">
                            <span class="material-symbols-outlined icon-sm" aria-hidden="true">close</span>
                        </button>
                    </header>
                    <div id="spinStage">
                        <div class="spin-grid" id="spinGrid"></div>
                        <button class="spin-btn btn-reset" type="button" id="spinBtn">Spin</button>
                    </div>
                    <div id="spinResultStage" hidden>
                        <div class="spin-result" id="spinResult"></div>
                        <button class="spin-btn btn-reset" type="button" id="spinOkBtn">OK</button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script src="./scripts/scripts.js"></script>
    <script src="./scripts/misi.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js").catch(() => {});
            });
        }
    </script>
</body>

</html>
