<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#00A5EB">
    <title>Skuling: Peringkat</title>
    <link rel="stylesheet" href="./css/globals.css">
    <link rel="stylesheet" href="./css/guide.css">
    <link rel="stylesheet" href="./css/peringkat.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,1,0"
        rel="stylesheet">
</head>

<body data-page="peringkat" data-home-tab="battle" data-home-navbar="leaderboard-navbar">
    <div class="device-frame">
        <main class="peringkat">

            <div id="topbarPlaceholder"></div>

            <div id="homeNavbarPlaceholder"></div>

            <section class="rank-banner" aria-label="Peringkat global kamu">
                <span class="rank-banner-label">
                    Your Global Rank
                    <button type="button" class="rank-help-btn" id="rankHelpIcon" aria-label="Bantuan peringkat">
                        <span class="material-symbols-outlined icon-xxs" aria-hidden="true">help</span>
                    </button>
                </span>
                <span class="rank-banner-value" id="rankBannerValue">#280178/280178</span>
            </section>

            <section class="rank-filters" aria-label="Filter peringkat">
                <button type="button" class="rank-filter-tingkat" data-not-in-scenario>
                    <span><strong>Tingkat</strong> Nasional</span>
                    <span class="material-symbols-outlined icon-xs" aria-hidden="true">tune</span>
                </button>
                <button type="button" class="rank-filter-toggle rank-filter-toggle--active" data-not-in-scenario>
                    <span class="material-symbols-outlined icon-xs" aria-hidden="true">person</span>
                    Individu
                </button>
                <button type="button" class="rank-filter-toggle" data-not-in-scenario>
                    <span class="material-symbols-outlined icon-xs" aria-hidden="true">school</span>
                    Sekolah
                </button>
            </section>

            <h1 class="rank-period">30 Hari Terakhir</h1>

            <div class="rank-list" id="rankList" aria-label="Daftar peringkat"></div>

            <div id="navbarPlaceholder"></div>

        </main>
    </div>

    <script src="./scripts/scripts.js"></script>
    <script src="./scripts/peringkat.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js").catch(() => {});
            });
        }
    </script>
</body>

</html>
