<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Skuling: Rank</title>
    <link rel="stylesheet" href="./css/globals.css">
    <link rel="stylesheet" href="./css/guide.css">
    <link rel="stylesheet" href="./css/rank.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,1,0"
        rel="stylesheet">
</head>

<body data-page="rank">
    <div class="device-frame">
        <main class="rk">

            <header class="rk-top-bar">
                <button class="back-btn btn-reset" type="button" aria-label="Kembali" onclick="history.back()">
                    <span class="material-symbols-outlined icon-sm" aria-hidden="true">arrow_back</span>
                </button>
                <h1 class="rk-title">Rank (@adyyt)</h1>
            </header>

            <img class="rk-hero-img" src="./img/rank-card-contender-hero.png" alt="Rank Contender — berhasil mengumpulkan 8 badges, hanya 20% SkulChamps mencapai ranking ini">

            <h2 class="rk-section-label">Rank Diperoleh</h2>
            <img class="rk-row-img" src="./img/rank-card-explorer.png" alt="Explorer — mengumpulkan 4 badge, 40% SkulChamps mencapai ranking ini">
            <img class="rk-row-img" src="./img/rank-card-rookie.png" alt="Rookie — mengumpulkan 0 badge, 100% SkulChamps mencapai ranking ini">

            <h2 class="rk-section-label">Rank Terkunci</h2>
            <img class="rk-row-img" src="./img/rank-card-prodigy.png" alt="Prodigy — mengumpulkan 12 badge, 10% SkulChamps mencapai ranking ini">
            <img class="rk-row-img" src="./img/rank-card-legend.png" alt="Legend — mengumpulkan 16 badge, 5% SkulChamps mencapai ranking ini">
            <img class="rk-row-img" src="./img/rank-card-allstar.png" alt="All Star — mengumpulkan 20 badge, 1% SkulChamps mencapai ranking ini">

        </main>
    </div>

    <script src="./scripts/scripts.js"></script>
    <script src="./scripts/rank.js"></script>
</body>

</html>
