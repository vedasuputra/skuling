<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#00A5EB">
    <title>Skuling: Universitas Pendidikan Ganesha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,1,0"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/globals.css">
    <link rel="stylesheet" href="./css/guide.css">
    <link rel="stylesheet" href="./css/squad-page.css">
</head>

<body data-page="skulworld">
    <div class="device-frame">
        <main class="squad-page">

            <header class="app-top-bar app-top-bar--simple squad-page-header">
                <div class="app-top-bar-row">
                    <div class="app-top-bar-left">
                        <button class="back-btn btn-reset" type="button" aria-label="Kembali" id="squadBackBtn">
                            <span class="material-symbols-outlined icon-sm" aria-hidden="true">arrow_back</span>
                        </button>
                        <img class="squad-page-avatar" src="./img/undiksha.png" alt="">
                        <span class="squad-page-info">
                            <span class="squad-page-name">Universitas Pendidikan Ganesha</span>
                            <span class="squad-page-meta">
                                <span class="material-symbols-outlined icon-xxs" aria-hidden="true">public</span>
                                Public
                                <span class="material-symbols-outlined icon-xxs" aria-hidden="true">group</span>
                                30 Anggota
                            </span>
                        </span>
                    </div>
                    <button class="squad-page-menu-btn btn-reset" type="button" aria-label="Menu lainnya"
                        data-not-in-scenario>
                        <span class="material-symbols-outlined icon-sm" aria-hidden="true">more_vert</span>
                    </button>
                </div>
            </header>

            <div class="squad-page-tabs" role="tablist">
                <button type="button" class="squad-page-tab squad-page-tab--active btn-reset" role="tab"
                    aria-selected="true">Featured</button>
                <button type="button" class="squad-page-tab btn-reset" role="tab" aria-selected="false"
                    data-not-in-scenario>Discussion</button>
                <button type="button" class="squad-page-tab btn-reset" role="tab" aria-selected="false"
                    data-not-in-scenario>Channel</button>
            </div>

            <div class="squad-post-card" id="squadPostCard">
                <button type="button" class="squad-post-author btn-reset" data-not-in-scenario>
                    <img class="squad-post-author-avatar" src="./img/mascot-skully-icon.png" alt="">
                    <span class="squad-post-author-info">
                        <span class="squad-post-author-name">
                            <span class="material-symbols-outlined icon-xs squad-captain-verified"
                                aria-hidden="true">verified</span>
                            Squad Manager
                        </span>
                        <span class="squad-post-author-org">Skuling</span>
                    </span>
                    <span class="material-symbols-outlined icon-sm squad-post-more" aria-hidden="true"
                        data-not-in-scenario>more_vert</span>
                </button>

                <button type="button" class="squad-post-body btn-reset" id="openPostBtn">
                    <p class="squad-post-text">
                        <strong>Hi SkulChamps! Selamat datang di Skuling Squad! 🎉</strong><br><br>
                        Di sini, kita bukan cuma belajar, tapi tumbuh bareng, saling dukung, dan sama-sama ngejar PTN
                        impian! Setiap pertanyaan, perjuangan, dan semangat kamu itu penting. 💪
                    </p>
                    <span class="squad-post-readmore">Baca Selengkapnya</span>
                </button>

                <div class="squad-post-footer">
                    <button type="button" class="squad-post-action" id="squadLikeBtn" aria-label="Suka postingan">
                        <span class="material-symbols-outlined icon-sm" aria-hidden="true">thumb_up</span>
                        <span id="squadLikeCount">16</span>
                    </button>
                    <button type="button" class="squad-post-action" id="squadCommentBtn"
                        aria-label="Lihat komentar">
                        <span class="material-symbols-outlined icon-sm" aria-hidden="true">chat_bubble</span>
                        <span id="squadCommentCount">0 Komentar</span>
                    </button>
                    <span class="squad-post-date">02 Feb 2026, 20:11 WITA</span>
                    <button type="button" class="squad-post-share btn-reset" aria-label="Bagikan"
                        data-not-in-scenario>
                        <span class="material-symbols-outlined icon-sm" aria-hidden="true">ios_share</span>
                    </button>
                </div>
            </div>

        </main>
    </div>

    <script src="./scripts/scripts.js"></script>
    <script src="./scripts/skulworld-data.js"></script>
    <script src="./scripts/squad-page.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js").catch(() => {});
            });
        }
    </script>
</body>

</html>
